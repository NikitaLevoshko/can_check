name: Build Windows EXE
on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pyinstaller rich pytest python-can
          
      - name: Build EXE
        run: |
          pyinstaller --onefile --console --name=can_check_tool --add-data "src;src" ui.py
            
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: can_check_tool
          path: dist/can_check_tool.exe